<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI newsroom illustration</title>
  <desc id="desc">Editorial abstract image used only when a source article has no usable image.</desc>
