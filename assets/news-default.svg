    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172238"/><stop offset=".55" stop-color="#6f2e3c"/><stop offset="1" stop-color="#d04b38"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".85"><stop stop-color="#fff6d7" stop-opacity=".92"/><stop offset=".48" stop-color="#f6c45b" stop-opacity=".35"/><stop offset="1" stop-color="#f6c45b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="260" cy="180" r="270" fill="url(#orb)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3">
