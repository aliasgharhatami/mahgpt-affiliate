name: MahGPT Daily SEO Maintenance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.html'
      - 'scripts/seo-audit.mjs'
      - 'scripts/seo-content-audit.mjs'
      - 'scripts/validate-hreflang-sitemaps.mjs'
      - 'scripts/daily-analysis.mjs'
      - 'scripts/validate-daily-analysis.mjs'
      - 'scripts/social-queue-readiness.mjs'
      - 'scripts/validate-social-cadence.mjs'
      - 'scripts/validate-affiliate-links.mjs'
      - 'scripts/validate-higgsfield-pages.mjs'
      - '.github/workflows/social-delivery.yml'
      - '.github/workflows/publish-social-queue.yml'
      - '.github/workflows/test-instagram-publisher.yml'
      - '.github/workflows/update-news.yml'
      - 'config/social-affiliate-links.json'
      - 'go/descript.html'
      - 'go/soundraw.html'
      - 'go/pictory.html'
      - 'assets/daily-analysis.json'
      - 'news/analysis/**'
      - '*/news/index.html'
      - '*/news/analysis/**'
      - 'sitemap.xml'
      - 'sitemaps/**'
      - 'robots.txt'
      - '.github/workflows/daily-seo-maintenance.yml'
  schedule:
    - cron: "30 6 * * *"
permissions:
  contents: read
concurrency:
  group: mahgpt-seo-maintenance
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check daily refresh and social cadence guards
        run: |
          node --check scripts/social-queue-readiness.mjs
          node --check scripts/validate-social-cadence.mjs
          node --check scripts/validate-affiliate-links.mjs
          node --check scripts/validate-higgsfield-pages.mjs
          node scripts/validate-social-cadence.mjs
          node scripts/validate-affiliate-links.mjs
          node scripts/validate-higgsfield-pages.mjs
      - name: Generate daily analysis pages for validation
        run: |
          node scripts/daily-analysis.mjs
          node scripts/validate-daily-analysis.mjs
          node scripts/generate-sitemaps.mjs
      - name: Run deterministic SEO audit
        run: node scripts/seo-audit.mjs
      - name: Validate hreflang and sitemaps
        run: node scripts/validate-hreflang-sitemaps.mjs
      - name: Audit internal links, orphan candidates, headings and image alternatives
        run: node scripts/seo-content-audit.mjs
