name: Studio cloud capability discovery gate
on:
  pull_request:
    paths:
      - "functions/api/studio/capabilities.js"
      - "tests/studio-cloud-gateway.test.mjs"
      - ".github/workflows/studio-cloud-gateway.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-capability-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check functions/api/studio/capabilities.js
          node --test tests/studio-cloud-gateway.test.mjs
