name: Refresh MahGPT news
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
concurrency:
  group: mahgpt-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and filter partner news
        run: node scripts/update-news.mjs
      - name: Commit refreshed feed
        run: |
          git config user.name "MahGPT News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/news-feed.json
          git diff --cached --quiet || git commit -m "Refresh MahGPT partner news"
          git push
      - name: Build daily social queue
        run: node scripts/social-queue.mjs
      - name: Commit daily social queue
        run: |
          git config user.name "MahGPT News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social-queue.json data/social-delivery-history.json
          git diff --cached --quiet || git commit -m "Build daily MahGPT social queue"
          git push
