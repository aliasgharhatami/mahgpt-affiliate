name: Refresh MahGPT news
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
concurrency:
  group: mahgpt-news-and-telegram
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and filter partner news
        run: node scripts/update-news.mjs
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- assets/news-feed.json; then
            echo "No news changes"
          else
            git config user.name "MahGPT News Bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/news-feed.json
            git commit -m "Refresh MahGPT partner news"
            git push
          fi
      - name: Publish new news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@mahgptplus"
        run: node scripts/social-publisher.mjs automatic
      - name: Persist Telegram duplicate state
        run: |
          if git diff --quiet -- data/telegram-published.json; then
            echo "No Telegram state changes"
            exit 0
          fi
          git config user.name "MahGPT News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telegram-published.json
          git commit -m "Track MahGPT Telegram deliveries"
          git push
