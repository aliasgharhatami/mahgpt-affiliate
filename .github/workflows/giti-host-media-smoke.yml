name: Gerde Giti - verify binary media on Render (NO INSTAGRAM POSTS)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/giti-host-media-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerde-giti-media-host-upload
  cancel-in-progress: false

jobs:
  publish-test-media-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install portable free encoder and generate labelled test JPEG and MP4
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pillow imageio-ffmpeg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import imageio_ffmpeg,os,subprocess
          p=Path('/tmp/giti-diag');p.mkdir(parents=True,exist_ok=True)
          img=Image.new('RGB',(1080,1350),(232,223,209))
          draw=ImageDraw.Draw(img)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',38)
          msg='TECHNICAL TEST ONLY - NOT A NEWS POST'
          draw.text((540,675),msg,fill=(35,35,35),font=f,anchor='mm')
          img.save(p/'test.jpg',quality=88)
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ffmpeg,'-nostdin','-y','-loglevel','error','-loop','1','-framerate','24','-i',str(p/'test.jpg'),'-f','lavfi','-i','sine=frequency=220:sample_rate=44100:duration=3','-t','3','-vf','scale=360:640','-c:v','libx264','-preset','veryfast','-crf','26','-pix_fmt','yuv420p','-c:a','aac','-b:a','96k','-movflags','+faststart',str(p/'test.mp4')],check=True)
          proc=subprocess.run([ffmpeg,'-hide_banner','-i',str(p/'test.mp4')],capture_output=True,text=True)
          assert 'Video:' in proc.stderr and 'Audio:' in proc.stderr, 'Video and audio expected'
          assert (p/'test.mp4').stat().st_size>2000 and (p/'test.jpg').stat().st_size>5000
          print('Created fully labelled test JPEG+MP4; NOT news or publishable media.')
          PY
      - name: Commit test binary files ONLY to dedicated Render branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin giti-media-host-20261026
          git switch -C giti-media-host-20261026 origin/giti-media-host-20261026
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p gardagard-giti/media-host/public/checks
          cp /tmp/giti-diag/test.mp4 gardagard-giti/media-host/public/checks/transport-test.mp4
          cp /tmp/giti-diag/test.jpg gardagard-giti/media-host/public/checks/transport-test.jpg
          git add gardagard-giti/media-host/public/checks
          if ! git diff --cached --quiet; then
            git commit -m "test(giti): diagnostic video and image media transport (not publishable)"
            git push origin HEAD:giti-media-host-20261026
          else
            echo "Diagnostic files already present."
          fi
      - name: Verify externally fetched binary files exactly match local test assets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          base='https://gerde-giti-media.onrender.com/checks'
          for fn,expected_type in [('transport-test.mp4','video/mp4'),('transport-test.jpg','image/jpeg')]:
              local=Path('/tmp/giti-diag')/('test.mp4' if fn.endswith('.mp4') else 'test.jpg')
              digest=hashlib.sha256(local.read_bytes()).hexdigest()
              url=base+'/'+fn
              last=''
              for attempt in range(35):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                          data=r.read()
                          kind=r.headers.get('Content-Type','').split(';')[0]
                          if r.status==200 and kind==expected_type and hashlib.sha256(data).hexdigest()==digest:
                              print('HTTP 200, expected type and SHA-256 identical:',fn,len(data),'bytes')
                              break
                          last=f'HTTP {r.status}, type {kind}, hashes match {hashlib.sha256(data).hexdigest()==digest}'
                  except Exception as e: last=str(e)
                  time.sleep(10)
              else:
                  raise RuntimeError('Public Render asset validation failed for '+fn+': '+last)
          print('External binary host transport PASSED. No Instagram API calls made.')
          PY
