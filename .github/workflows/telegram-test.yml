name: Test MahGPT Telegram publisher
on:
  workflow_dispatch:
    inputs:
      source:
        description: Required exact source URL from assets/news-feed.json; choose one current story that has not been tested before
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send exactly one controlled test post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@mahgptplus"
          TEST_SOURCE: ${{ inputs.source }}
        run: node scripts/social-publisher.mjs test
