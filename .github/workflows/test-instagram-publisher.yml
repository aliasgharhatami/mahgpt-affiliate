name: Test MahGPT Instagram publisher

on:
  workflow_dispatch:
    inputs:
      queue_index:
        description: Optional zero-based queue item index; blank selects first unpublished Instagram item
        required: false
        default: ""
      dry_run:
        description: Validate selection and caption without calling Instagram
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mahgpt-instagram-manual
  cancel-in-progress: false

jobs:
  publish-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Publish or validate exactly one Instagram item
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_QUEUE_INDEX: ${{ inputs.queue_index }}
          INSTAGRAM_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/instagram-publisher.mjs
      - name: Commit Instagram delivery state
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-queue.json data/instagram-delivery-history.json
          git diff --cached --quiet || git commit -m "chore: record Instagram delivery state"
          git push
