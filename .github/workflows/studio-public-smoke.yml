name: Studio public deployment smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/studio-public-smoke.yml"
      - "index.html"
      - "ai-video-studio/studio-account.js"
      - "ai-video-studio/studio-config.js"
      - "ai-video-studio/backend/legal-launch-gates.json"
      - "scripts/check-studio-legal-gates.mjs"
      - "ai-video-studio/index.html"
      - "confirm-email.html"
      - "privacy-policy.html"
      - "terms-of-service.html"
      - "editorial-policy.html"
      - "ai-video-studio/privacy.html"
      - "ai-video-studio/terms.html"
      - "ai-video-studio/confirm-email.js"
      - "ai-video-studio/privacy.html"
      - "ai-video-studio/terms.html"
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Enforce legal feature launch gates
        run: node scripts/check-studio-legal-gates.mjs
      - name: Check public Supabase Auth providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          cfg=open('ai-video-studio/studio-config.js').read()
          key=re.search(r'supabasePublishableKey: "(sb_publishable_[^"]+)"',cfg)
          if not key:raise SystemExit('Missing public publishable key')
          open('/tmp/studio-public-key','w').write(key.group(1))
          PY
          curl -fLsS --max-time 15 -H "apikey: $(cat /tmp/studio-public-key)" "https://gthwpfscrewwamjxheyj.supabase.co/auth/v1/settings" -o /tmp/studio-auth-settings.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/studio-auth-settings.json'))
          print('Email auth enabled:',j.get('external',{}).get('email'))
          print('Google auth enabled:',j.get('external',{}).get('google'))
          PY
      - name: Check deployed homepage and sign-in scripts
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare Pages may take a minute to update after a push.
          for trial in {1..15}; do
            curl -fLsS --max-time 15 -H "Cache-Control: no-cache" "https://mahgpt.com/?studio_check=${GITHUB_SHA}" -o /tmp/studio-home.html || true
            if grep -q "Login build 06" /tmp/studio-home.html 2>/dev/null &&
               grep -q 'href="/privacy-policy.html"' /tmp/studio-home.html 2>/dev/null &&
               grep -q 'href="/terms-of-service.html"' /tmp/studio-home.html
          grep -q 'id="studio-purpose-heading"' /tmp/studio-home.html
          grep -q 'AI-generated non-consensual intimate imagery' /tmp/studio-home.html
          grep -q 'Google OAuth is used only to authenticate your account' /tmp/studio-home.html 2>/dev/null; then
              echo "Deployed Studio contains public legal links and Login build 06"
              break
            fi
            if [ "$trial" -eq 15 ]; then
              echo "::error::Cloudflare is serving an older homepage without Studio legal links."
              exit 1
            fi
            sleep 8
          done
          echo "Checking live login form and account JS"
          grep -q 'href="/privacy-policy.html"' /tmp/studio-home.html
          grep -q 'href="/terms-of-service.html"' /tmp/studio-home.html
          grep -q 'id="auth-email-submit" type="button"' /tmp/studio-home.html
          grep -q 'src="/ai-video-studio/studio-account.js?v=20261102-fix6"' /tmp/studio-home.html
          curl -fLsS --max-time 15 "https://mahgpt.com/ai-video-studio/studio-account.js?v=${GITHUB_SHA}" -o /tmp/studio-account.js
          grep -q "signInWithOtp" /tmp/studio-account.js
          curl -fLsS --max-time 15 "https://mahgpt.com/ai-video-studio/studio-config.js?v=${GITHUB_SHA}" -o /tmp/studio-config.js
          grep -q "registrationAudience: 'public-beta'" /tmp/studio-config.js
          grep -q 'public-beta-2026-11-02-v3' /tmp/studio-config.js
          curl -fLsS --max-time 15 "https://mahgpt.com/ai-models/" -o /tmp/ai-models.html
          grep -q "The AI Tools Report" /tmp/ai-models.html
          echo "Checking Supabase browser library"
          curl -fLsS --max-time 20 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" -o /tmp/supabase-sdk.js
          test "$(wc -c </tmp/supabase-sdk.js)" -gt 10000
          grep -q "createClient" /tmp/supabase-sdk.js
          echo "Checking first-party confirmation page"
          for trial in {1..12}; do
            curl -fLsS --max-time 15 -H "Cache-Control: no-cache" "https://mahgpt.com/confirm-email.html?deploycheck=${GITHUB_SHA}" -o /tmp/confirm-email.html || true
            if grep -q "Confirm Email &amp; Open My Projects" /tmp/confirm-email.html 2>/dev/null; then break; fi
            if [ "$trial" -eq 12 ]; then
              echo "::error::Confirmation page absent on live domain"
              exit 1
            fi
            sleep 8
          done
          echo "Confirmation page online"
          curl -fLsS --max-time 15 "https://mahgpt.com/ai-video-studio/confirm-email.js?v=${GITHUB_SHA}" -o /tmp/confirm-email.js
          grep -q "verifyOtp" /tmp/confirm-email.js
          echo "Confirmation script online"
          echo "Checking standalone legal pages for Google verification"
          curl -fLsS --max-time 15 "https://mahgpt.com/privacy-policy.html?deploycheck=${GITHUB_SHA}" -o /tmp/privacy.html
          grep -q '<h1>Privacy Policy</h1>' /tmp/privacy.html
          grep -q 'Google Sign-In' /tmp/privacy.html
          grep -q 'Google generative AI APIs' /tmp/privacy.html
          grep -q 'image' /tmp/privacy.html
          curl -fLsS --max-time 15 "https://mahgpt.com/terms-of-service.html?deploycheck=${GITHUB_SHA}" -o /tmp/terms.html
          grep -q '<h1>Terms of Service</h1>' /tmp/terms.html
          grep -q 'Prohibited AI NCII' /tmp/terms.html
          curl -fLsS --max-time 15 "https://mahgpt.com/editorial-policy.html?deploycheck=${GITHUB_SHA}" -o /tmp/editorial-policy.html
          grep -q 'MAH GPT Studio: privacy and customer media' /tmp/editorial-policy.html
          echo "PASS: Live Studio, public privacy/terms, editorial cross-links and OAuth pages"
      - name: Check public Supabase Auth settings (no email sent)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,sys
          cfg=open('/tmp/studio-config.js').read()
          key=re.search(r'supabasePublishableKey: "(sb_publishable_[^"]+)"',cfg)
          if not key:sys.exit("Public client config missing publishable key")
          open('/tmp/studio-public-key','w').write(key.group(1))
          PY
          curl -fLsS --max-time 15 -H "apikey: $(cat /tmp/studio-public-key)" "https://gthwpfscrewwamjxheyj.supabase.co/auth/v1/settings" -o /tmp/studio-auth-settings.json
          python3 - <<'PY'
          import json
          with open('/tmp/studio-auth-settings.json') as f:
              settings=json.load(f)
          print('Supabase Auth provider email enabled:',settings.get('external',{}).get('email','not exposed'))
          print('Supabase Auth provider Google enabled:',settings.get('external',{}).get('google','not exposed'))
          PY
