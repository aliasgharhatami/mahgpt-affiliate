name: MahGPT IndexNow notification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/indexnow-notify.mjs'
      - 'tests/indexnow-notify.test.mjs'
      - '.github/workflows/indexnow-notify.yml'
  workflow_run:
    workflows: ["Generate zero-cost multilingual pages"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: mahgpt-indexnow
  cancel-in-progress: true
jobs:
  notify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test IndexNow safety helpers
        run: node --test tests/indexnow-notify.test.mjs
      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .cache/indexnow-state.json
          key: ${{ github.repository }}-${{ hashFiles('sitemap.xml', 'sitemaps/*.xml') }}
          restore-keys: |
            indexnow-state-${{ github.repository }}-
      - name: Notify IndexNow (non-blocking)
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || vars.INDEXNOW_DRY_RUN || 'true' }}
          INDEXNOW_KEY_LOCATION: ${{ vars.INDEXNOW_KEY_LOCATION || 'https://mahgpt.com/indexnow-key.txt' }}
        run: node scripts/indexnow-notify.mjs
      - name: Save notification state
        if: always() && github.event_name == 'workflow_run'
        uses: actions/cache/save@v4
        with:
          path: .cache/indexnow-state.json
          key: indexnow-state-${{ github.repository }}-${{ hashFiles('sitemap.xml', 'sitemaps/*.xml') }}
