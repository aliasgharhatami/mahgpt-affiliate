name: Deliver scheduled MahGPT social items

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh MahGPT news"]
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/social-delivery.yml"
      - "scripts/social-publisher.mjs"
      - "scripts/instagram-publisher.mjs"
      - "scripts/social-queue-readiness.mjs"

permissions:
  contents: write

concurrency:
  group: mahgpt-social-delivery
  cancel-in-progress: false

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate social automation syntax
        run: |
          node --check scripts/social-publisher.mjs
          node --check scripts/instagram-publisher.mjs
          node --check scripts/social-queue-readiness.mjs
          node scripts/social-queue-readiness.mjs

  deliver:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Publish at most one eligible Telegram item
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@mahgptplus"
        run: node scripts/social-publisher.mjs queue-next
      - name: Publish at most one eligible Instagram item
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: node scripts/instagram-publisher.mjs
      - name: Commit delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-queue.json data/social-delivery-history.json data/instagram-delivery-history.json
          git diff --cached --quiet || git commit -m "chore: record scheduled social delivery"
          git push
