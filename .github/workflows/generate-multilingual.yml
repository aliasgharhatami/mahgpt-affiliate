name: Generate zero-cost multilingual pages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'partners/**'
      - 'config/locales.json'
      - 'scripts/generate-multilingual.mjs'
      - 'scripts/generate-higgsfield-pages.mjs'
      - 'scripts/validate-higgsfield-pages.mjs'
      - 'scripts/validate-multilingual.mjs'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/validate-hreflang-sitemaps.mjs'
      - 'scripts/seo-content-audit.mjs'
      - 'config/topic-clusters.json'
      - 'scripts/validate-topic-clusters.mjs'
      - 'scripts/apply-topic-cluster-links.mjs'
      - 'news/story.html'
      - 'guides/**'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/generate-multilingual.mjs
      - run: node scripts/validate-higgsfield-pages.mjs
      - run: node scripts/validate-multilingual.mjs
      - run: node scripts/generate-sitemaps.mjs
      - run: node scripts/validate-hreflang-sitemaps.mjs
      - run: node scripts/validate-topic-clusters.mjs
      - run: node scripts/apply-topic-cluster-links.mjs
      - run: node scripts/seo-content-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: multilingual-static-pages
          path: '**/partners/*.html'
