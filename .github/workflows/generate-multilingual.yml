name: Generate zero-cost multilingual pages\non:\n  workflow_dispatch:\n  pull_request:\n    paths:\n      - 'partners/**'\n      - 'config/locales.json'\n      - 'scripts/generate-multilingual.mjs'\n      - 'scripts/validate-multilingual.mjs'\npermissions:\n  contents: read\njobs:\n  generate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: {node-version: 20}\n      - run: node scripts/generate-multilingual.mjs\n      - run: node scripts/validate-multilingual.mjs\n      - uses: actions/upload-artifact@v4\n        with:\n          name: multilingual-static-pages\n          path: '**/partners/*.html'\n